<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MéMonde | World Guesser</title>

    <!-- Primary -->
    <meta name="description" content="A geography guessing game — name all 197 countries of the world in 15 minutes." />
    <meta name="author" content="Coko" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)"  content="#1e1e2e" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eff1f5" />

    <!-- Open Graph -->
    <meta property="og:type"        content="website" />
    <meta property="og:title"       content="Memonde | World Guesser" />
    <meta property="og:description" content="A geography guessing game — name all 197 countries of the world in 15 minutes." />
    <meta property="og:image"       content="https://github.com/user-attachments/assets/a025b188-4be3-4ae3-8302-1fdf8f0d6405" />
    <meta property="og:image:width"  content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:url" content="https://memonde.coko7.fr" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Memonde | World Guesser" />
    <meta name="twitter:description" content="A geography guessing game — name all 197 countries of the world in 15 minutes." />
    <meta name="twitter:image"       content="https://github.com/user-attachments/assets/a025b188-4be3-4ae3-8302-1fdf8f0d6405" />

    <!-- Apply theme before CSS renders to avoid flash -->
    <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = theme;
    })();
    </script>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="icon"
      href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">🌍</text></svg>'
    >
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header id="topbar">
        <div id="lang-toggle">
          <button id="btn-en" class="lang-btn active" aria-label="English">EN</button>
          <span class="lang-sep">|</span>
          <button id="btn-fr" class="lang-btn" aria-label="Français">FR</button>
        </div>
        <span id="topbar-title">MéMonde</span>
        <div id="right-menu">
          <a id="btn-github" href="https://github.com/coko7/memonde" target="_blank" rel="noopener" aria-label="GitHub repository">
            <svg viewBox="0 0 16 16" aria-hidden="true" fill="currentColor">
              <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
            </svg>
          </a>
          <button id="btn-theme" title="Toggle light/dark">☀️</button>
        </div>
      </header>

      <!-- Map -->
      <div id="map-container">
        <svg id="world-map"></svg>
        <div id="map-tooltip" aria-hidden="true"></div>
      </div>

      <!-- Score bar -->
      <div id="score-bar">
        <div id="timer-display">15:00</div>
        <div id="score-display"><span id="score-label">Score</span> <span id="score-value">0</span>/<span id="score-target">197</span></div>
      </div>

      <!-- Input row -->
      <div id="input-row">
        <div id="input-wrap" hidden>
          <input id="country-input" type="text" autocomplete="off" spellcheck="false"
            placeholder="Type a country…" disabled />
          <div id="feedback"></div>
        </div>
        <button id="btn-action" class="primary">Start</button>
        <button id="btn-share" class="secondary" hidden>Share</button>
        <button id="btn-copy-summary" class="secondary" hidden>Copy summary</button>
      </div>

      <!-- Continent table -->
      <div id="table-wrap">
        <table id="continent-table">
          <thead>
            <tr id="table-header"></tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- Data -->
    <script src="data/countries.js"></script>

    <!-- D3 + TopoJSON from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>

    <!-- Game -->
    <script src="src/utils.js"></script>
    <script src="src/ui.js"></script>
    <script src="src/game.js"></script>
  </body>
</html>
